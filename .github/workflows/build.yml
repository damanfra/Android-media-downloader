name: Gerar APK e Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Chave de assinatura (opcional)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem SIGNING_KEYSTORE_BASE64 — APK assinado com chave de debug temporária."
          fi
      - name: Compilar
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk BaixaVideo-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BaixaVideo-apk
          path: BaixaVideo-v1.0.${{ github.run_number }}.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BaixaVídeo v1.0.${{ github.run_number }}
          body: APK gerado automaticamente a partir do commit ${{ github.sha }}.
          files: BaixaVideo-v1.0.${{ github.run_number }}.apk
          make_latest: true
